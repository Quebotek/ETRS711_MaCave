services:
  db:
    image: mariadb:11
    container_name: macave-db
    environment:
      MARIADB_ROOT_PASSWORD: root_secret
      MARIADB_DATABASE: macave
      MARIADB_USER: macave
      MARIADB_PASSWORD: macave_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  macave:
    build: .
    container_name: macave
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      # Persistance des uploads (photos des vins)
      - ./uploads:/app/uploads
    environment:
      - SECRET_KEY=${SECRET_KEY:-macave-dev-secret-key}
      - DATABASE_URL=mysql+pymysql://macave:macave_password@db:3306/macave
      - FLASK_DEBUG=false
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
    restart: unless-stopped

volumes:
  mariadb_data:
